# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: ../src/Controller/
    type: attribute

    app_home:
        path: /{_locale}/
        controller: App\Controller\VideoController::index
        requirements:
            _locale: fr|en

    app_video_index:
        path: /{_locale}/video
        controller: App\Controller\VideoController::index
        requirements:
            _locale: fr|en

    app_video_create:
        path: /{_locale}/video/create
        controller: App\Controller\VideoController::create
        requirements:
            _locale: fr|en

    app_video_show:
        path: /{_locale}/video/{id}
        controller: App\Controller\VideoController::show
        requirements:
            _locale: fr|en
            id: \d+

    app_video_edit:
        path: /{_locale}/video/{id}/edit
        controller: App\Controller\VideoController::edit
        requirements:
            _locale: fr|en
            id: \d+

    app_video_delete:
        path: /{_locale}/video/{id}/delete
        controller: App\Controller\VideoController::delete
        requirements:
            _locale: fr|en
            id: \d+

    app_login:
        path: /{_locale}/login
        controller: App\Controller\SecurityController::login
        requirements:
            _locale: fr|en

    app_logout:
        path: /{_locale}/logout
        controller: App\Controller\SecurityController::logout
        requirements:
            _locale: fr|en

    app_register:
        path: /{_locale}/register
        controller: App\Controller\RegistrationController::register
        requirements:
            _locale: fr|en

    app_profile:
        path: /{_locale}/profile
        controller: App\Controller\AccountController::index
        requirements:
            _locale: fr|en

    app_profile_edit:
        path: /{_locale}/profile/edit
        controller: App\Controller\AccountController::edit
        requirements:
            _locale: fr|en
